name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            exe: amira
          - os: windows-latest
            target: bun-windows-x64
            exe: amira.exe
          - os: macos-latest
            target: bun-darwin-arm64
            exe: amira
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # bun run test (inside check) uses the repository's isolated test-home preload.
      # No AMIRA_LIVE_* opt-ins or provider secrets are set in this workflow.
      - run: bun run check
      - name: Compile the runner's native target
        env:
          TARGET: ${{ matrix.target }}
        run: bun run build --target "$TARGET"
      - name: Smoke-test the executable
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          "./dist/amira-$TARGET/$EXE" --version
          "./dist/amira-$TARGET/$EXE" --self-check
