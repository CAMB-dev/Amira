name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            exe: amira
          - os: windows-latest
            target: bun-windows-x64
            exe: amira.exe
          - os: macos-latest
            target: bun-darwin-arm64
            exe: amira
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Headless terminal rendering needs real CJK glyphs, not just the runner's emoji fonts.
      - name: Install terminal rendering fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk
      - run: bun install --frozen-lockfile
      # CI alone retries failed test files once; static checks are never retried.
      # Both test runs use the repository's isolated test-home preload.
      # No AMIRA_LIVE_* opt-ins or provider secrets are set in this workflow.
      - name: Run checks and tests
        # A hang should fail this step with a visible log tail, not cancel the whole job.
        timeout-minutes: 20
        env:
          CI_TEST_SUMMARY_FILE: ${{ runner.temp }}/ci-test-summary.txt
        run: |
          set -o pipefail
          (bun run architecture:check && bun run typecheck && bun run lint && bun scripts/ci-test.ts) 2>&1 | tee "$RUNNER_TEMP/check.log"
      # Job logs need sign-in; annotations do not. Surface the failing lines as annotations
      # so failures that are not expect() errors (crashes, file timeouts) are still visible.
      - name: Annotate check failures
        if: failure() || cancelled()
        run: |
          log="$RUNNER_TEMP/check.log"
          # One nine-line budget: retry outcome, unique failing names, then the log tail.
          bun scripts/ci-test.ts --annotate "$log" "$RUNNER_TEMP/ci-test-summary.txt"
      - name: Compile the runner's native target
        env:
          TARGET: ${{ matrix.target }}
        run: bun run build --target "$TARGET"
      - name: Smoke-test the executable
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          "./dist/amira-$TARGET/$EXE" --version
          "./dist/amira-$TARGET/$EXE" --self-check
      - name: Compile a native Windows test-only server
        if: runner.os == 'Windows'
        run: bun scripts/build-server.ts --native-windows-test --build-id 0123456789abcdef0123456789abcdef01234567
      - name: Smoke the native Windows test-only server
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/server-smoke/home" "$RUNNER_TEMP/server-smoke/remote-home" "$RUNNER_TEMP/server-smoke/workspace"
          export HOME="$RUNNER_TEMP/server-smoke/home" USERPROFILE="$RUNNER_TEMP/server-smoke/home"
          export AMIRA_HOME="$RUNNER_TEMP/server-smoke/home/amira"
          export XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache" XDG_DATA_HOME="$HOME/data" XDG_STATE_HOME="$HOME/state" XDG_RUNTIME_DIR="$HOME/runtime"
          ./dist/amira-server-native-test.exe --version-json
          ./dist/amira-server-native-test.exe --self-check

  server:
    name: Build production Linux servers (CI only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-server.ts --all --build-id 0123456789abcdef0123456789abcdef01234567
      - name: Verify server manifest signing without release credentials
        run: |
          bun scripts/server-manifest.ts generate
          bun scripts/server-manifest.ts sign --ephemeral true > "$RUNNER_TEMP/server-public.pem"
          bun scripts/server-manifest.ts verify --public-key "$RUNNER_TEMP/server-public.pem"
      - name: Verify and smoke the Linux x64 baseline server (no Bun installation)
        run: |
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("dist/server-manifest.json").read_text())
          assert manifest["product"] == "amira-server"
          for artifact in manifest["artifacts"]:
              file = Path("dist") / artifact["file"]
              data = file.read_bytes()
              assert len(data) == artifact["size"], file
              assert hashlib.sha256(data).hexdigest() == artifact["sha256"], file
          PYCODE
          mkdir -p "$RUNNER_TEMP/server-smoke/home" "$RUNNER_TEMP/server-smoke/remote-home" "$RUNNER_TEMP/server-smoke/workspace"
          export HOME="$RUNNER_TEMP/server-smoke/home" USERPROFILE="$RUNNER_TEMP/server-smoke/home"
          export AMIRA_HOME="$RUNNER_TEMP/server-smoke/home/amira"
          export XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache" XDG_DATA_HOME="$HOME/data" XDG_STATE_HOME="$HOME/state" XDG_RUNTIME_DIR="$HOME/runtime"
          chmod 755 dist/amira-server-bun-linux-x64-baseline
          python3 - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          manifest = json.loads(Path("dist/server-manifest.json").read_text())
          for flag in ["--version-json", "--self-check"]:
              result = json.loads(subprocess.check_output(["./dist/amira-server-bun-linux-x64-baseline", flag], text=True))
              for key in ["product", "version", "channel", "buildId"]:
                  assert result[key] == manifest[key], key
              assert result["target"] == "bun-linux-x64-baseline"
              if flag == "--self-check":
                  assert result["ok"] and result["worker"] == "worker" and result["stdoutWorker"], result
          PYCODE
          echo 'Server Linux x64 baseline native smoke passed. Server Linux ARM64 execution unverified: no native runner.' >> "$GITHUB_STEP_SUMMARY"
