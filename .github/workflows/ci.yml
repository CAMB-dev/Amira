name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            exe: amira
          - os: windows-latest
            target: bun-windows-x64
            exe: amira.exe
          - os: macos-latest
            target: bun-darwin-arm64
            exe: amira
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Headless terminal rendering needs real CJK glyphs, not just the runner's emoji fonts.
      - name: Install terminal rendering fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk
      - run: bun install --frozen-lockfile
      # bun run test (inside check) uses the repository's isolated test-home preload.
      # No AMIRA_LIVE_* opt-ins or provider secrets are set in this workflow.
      - name: Run bun run check
        run: |
          set -o pipefail
          bun run check 2>&1 | tee "$RUNNER_TEMP/check.log"
      # Job logs need sign-in; annotations do not. Surface the failing lines as annotations
      # so failures that are not expect() errors (crashes, file timeouts) are still visible.
      - name: Annotate check failures
        if: failure()
        run: |
          log="$RUNNER_TEMP/check.log"
          [ -f "$log" ] || exit 0
          grep -E '^\(fail\)|^error|[Ee]rror:|^ *[0-9]+ fail|timed out|Unhandled' "$log" | tail -n 25 > "$RUNNER_TEMP/failures.txt" || true
          [ -s "$RUNNER_TEMP/failures.txt" ] || tail -n 25 "$log" > "$RUNNER_TEMP/failures.txt"
          while IFS= read -r line; do
            line=${line//%/%25}
            echo "::error title=bun run check::${line//$'\r'/}"
          done < "$RUNNER_TEMP/failures.txt"
      - name: Compile the runner's native target
        env:
          TARGET: ${{ matrix.target }}
        run: bun run build --target "$TARGET"
      - name: Smoke-test the executable
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          "./dist/amira-$TARGET/$EXE" --version
          "./dist/amira-$TARGET/$EXE" --self-check
