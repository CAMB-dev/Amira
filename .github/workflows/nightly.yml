name: Nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishers rather than cancelling a draft/asset upload halfway through.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Check for changes on main
    # A manual run from another branch would publish that branch's workflow; only main publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      sha: ${{ steps.plan.outputs.sha }}
      previous: ${{ steps.plan.outputs.previous }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select the commit and a fresh nightly tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import datetime
          import json
          import os
          import subprocess
          from scripts.release_policy import nightly_releases, next_nightly_tag

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          with open(os.path.join(os.environ["RUNNER_TEMP"], "releases.json")) as file:
              releases = [release for page in json.load(file) for release in page]
          nightlies = nightly_releases(releases)
          previous = nightlies[0]["tag_name"] if nightlies else ""
          sha = git("rev-parse", "HEAD")
          changed = not previous or bool(git("rev-list", f"{previous}..{sha}"))
          with open("packages/cli/package.json") as file:
              version = json.load(file)["version"]
          occupied = set(git("tag", "--list").splitlines())
          occupied.update(release["tag_name"] for release in releases)
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d")
          tag = next_nightly_tag(version, date, occupied)
          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              for key, value in {"changed": str(changed).lower(), "sha": sha,
                                 "previous": previous, "tag": tag, "version": tag[1:]}.items():
                  file.write(f"{key}={value}\n")
          if not changed:
              print("Main has no commits since the last nightly; skipping checks and publication.")
          PY

  ci:
    name: Require successful CI for the selected main commit
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      success: ${{ steps.ci.outputs.success }}
    steps:
      - name: Gate publication on CI, never rerun a divergent check matrix
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          echo "success=false" >> "$GITHUB_OUTPUT"
          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&per_page=100" > "$RUNNER_TEMP/ci-runs.json"; then
            echo "::notice::Skipping nightly for $SHA: could not query CI runs."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os

          sha = os.environ["SHA"]
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ci-runs.json")) as file:
              runs = [run for page in json.load(file) for run in page["workflow_runs"]
                      if run["head_sha"] == sha and run["head_branch"] == "main" and run["event"] == "push"]
          # Do not accept an older success if a newer run/rerun is pending or failed.
          latest = max(runs, key=lambda run: (run["run_number"], run["run_attempt"]), default=None)
          success = bool(latest and latest["status"] == "completed" and latest["conclusion"] == "success")
          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write(f"success={str(success).lower()}\n")
          if success:
              print(f"CI succeeded for {sha}.")
          else:
              reason = f"latest CI run is {latest['status']} ({latest['conclusion']})" if latest else "no CI push run found on main"
              print(f"::notice::Skipping nightly for {sha}: {reason}.")
          PY

  build:
    name: Cross-compile all seven targets
    needs: [plan, ci]
    if: needs.ci.outputs.success == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build channel next
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          AMIRA_SERVER_BUILD_ID: ${{ needs.plan.outputs.sha }}
        run: bun run build:all --version "$VERSION" --channel next
      - name: Build and sign separate Linux server artifacts (CI only)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_ID: ${{ needs.plan.outputs.sha }}
          SIGNING_KEY: ${{ secrets.AMIRA_RELEASE_ED25519_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'AMIRA_RELEASE_ED25519_KEY is required for server artifacts.' >&2; exit 1; }
          bun -e '
            import { createPublicKey } from "node:crypto"
            import { releasePublicKey } from "./packages/cli/src/update/public-key.ts"
            const publicPem = key => createPublicKey(key).export({ type: "spki", format: "pem" }).toString()
            if (releasePublicKey && publicPem(releasePublicKey) !== publicPem(process.env.SIGNING_KEY)) {
              throw new Error("Release signing secret does not match the compiled release public key")
            }
          '
          bun scripts/build-server.ts --all --version "$VERSION" --channel next --build-id "$BUILD_ID"
          bun scripts/server-manifest.ts generate
          bun scripts/server-manifest.ts sign --key-env SIGNING_KEY > "$RUNNER_TEMP/server-public.pem"
          bun scripts/server-manifest.ts verify --public-key "$RUNNER_TEMP/server-public.pem"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-archives
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/amira-server-bun-linux-*
            dist/SERVER_SHA256SUMS
            dist/server-manifest.json
            dist/server-manifest.json.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  smoke:
    name: Native archive smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: bun-linux-x64 bun-linux-x64-baseline
            exe: amira
          - os: windows-latest
            targets: bun-windows-x64 bun-windows-x64-baseline
            exe: amira.exe
          - os: macos-latest
            targets: bun-darwin-arm64
            exe: amira
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-archives
          path: dist
      - name: Verify checksums and smoke-test extracted archives (no Bun installation)
        env:
          TARGETS: ${{ matrix.targets }}
          EXE: ${{ matrix.exe }}
        run: |
          # macOS runners ship python3 only, Windows runners python only.
          py=$(command -v python3 || command -v python)
          "$py" - <<'PY'
          import hashlib
          from pathlib import Path

          for line in Path("dist/SHA256SUMS").read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              file = Path("dist") / name.lstrip("*")
              assert hashlib.sha256(file.read_bytes()).hexdigest() == digest, file
          PY
          for target in $TARGETS; do
            mkdir -p "smoke/$target"
            if [[ "$target" == bun-windows-* ]]; then
              # Git Bash on Windows runners has no unzip.
              "$py" -m zipfile -e "dist/amira-$target.zip" "smoke/$target"
            else
              tar -xzf "dist/amira-$target.tar.gz" -C "smoke/$target"
            fi
            exe=$(find "smoke/$target" -type f -name "$EXE")
            test -n "$exe"
            "$exe" --version
            "$exe" --self-check
          done
      - name: Verify and smoke the Linux x64 baseline server (no Bun installation)
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("dist/server-manifest.json").read_text())
          assert manifest["product"] == "amira-server"
          for artifact in manifest["artifacts"]:
              file = Path("dist") / artifact["file"]
              data = file.read_bytes()
              assert len(data) == artifact["size"], file
              assert hashlib.sha256(data).hexdigest() == artifact["sha256"], file
          PYCODE
          mkdir -p "$RUNNER_TEMP/server-smoke/home" "$RUNNER_TEMP/server-smoke/remote-home" "$RUNNER_TEMP/server-smoke/workspace"
          export HOME="$RUNNER_TEMP/server-smoke/home" USERPROFILE="$RUNNER_TEMP/server-smoke/home"
          export AMIRA_HOME="$RUNNER_TEMP/server-smoke/home/amira"
          export XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache" XDG_DATA_HOME="$HOME/data" XDG_STATE_HOME="$HOME/state" XDG_RUNTIME_DIR="$HOME/runtime"
          chmod 755 dist/amira-server-bun-linux-x64-baseline
          python3 - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          manifest = json.loads(Path("dist/server-manifest.json").read_text())
          for flag in ["--version-json", "--self-check"]:
              result = json.loads(subprocess.check_output(["./dist/amira-server-bun-linux-x64-baseline", flag], text=True))
              for key in ["product", "version", "channel", "buildId"]:
                  assert result[key] == manifest[key], key
              assert result["target"] == "bun-linux-x64-baseline"
              if flag == "--self-check":
                  assert result["ok"] and result["worker"] == "worker" and result["stdoutWorker"], result
          PYCODE
          echo 'Server Linux x64 baseline native smoke passed. Server Linux ARM64 execution unverified: no native runner.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record targets without a native smoke runner
        if: runner.os == 'macOS'
        run: |
          echo 'darwin-x64 smoke skipped: macos-13 retired in December 2025. linux-arm64 smoke skipped: this workflow has no Linux ARM64 runner.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish immutable nightly and prune older nightlies
    needs: [plan, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-archives
          path: dist
      - name: Create a draft, attach every asset, then publish once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS && sha256sum --check SERVER_SHA256SUMS)
          {
            printf 'Automated nightly from `%s` (channel `next`).\n\n' "$SHA"
            printf '## Commits since the previous nightly\n\n'
            if [[ -n "$PREVIOUS" ]]; then
              git log --format='- %h %s' "$PREVIOUS..$SHA"
            else
              git log --format='- %h %s' "$SHA"
            fi
            printf '\nNative smoke: Windows x64 and baseline, Linux x64 and baseline, macOS ARM64.\n'
            printf 'macOS x64 smoke skipped because macos-13 was retired; Linux ARM64 has no native runner in this workflow.\n'
          } > "$RUNNER_TEMP/notes.md"
          # Abort if another publisher created the tag after planning; never reuse its tag.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")
          test -z "$existing"
          # A failed earlier run can leave an unpublished draft under this tag name (drafts have no
          # tag yet, and the read-only plan job cannot see them). Remove it so the upload below
          # cannot land on the stale draft.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          # gh refuses an existing release; uploads never use --clobber.
          gh release create "$TAG" --target "$SHA" --draft --prerelease --latest=false \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS \
            dist/amira-server-bun-linux-* dist/SERVER_SHA256SUMS \
            dist/server-manifest.json dist/server-manifest.json.sig
          # This is the only edit, while still a draft. Never edit a published release.
          gh release edit "$TAG" --draft=false
      - name: Keep the newest 14 nightly prereleases (never stable releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from scripts.release_policy import nightly_releases

          with open(os.path.join(os.environ["RUNNER_TEMP"], "releases.json")) as file:
              releases = [release for page in json.load(file) for release in page]
          nightlies = nightly_releases(releases)
          for release in nightlies[14:]:
              # Deleting the release first unlocks its immutable tag for deletion.
              subprocess.run(["gh", "release", "delete", release["tag_name"],
                              "--yes", "--cleanup-tag"], check=True)
          PY
